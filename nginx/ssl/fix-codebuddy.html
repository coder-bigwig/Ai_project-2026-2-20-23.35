<!doctype html>
<html lang="zh-CN">
<head>

    body { font-family: Arial, "Microsoft YaHei", sans-serif; max-width: 720px; margin: 48px auto; line-height: 1.7; color: #222; }

<body>
  <div class="box">
    <h2>修复 CodeBuddy HTTPS 访问</h2>

      <li>安装完成后，关闭所有浏览器窗口。</li>
      <li>重新打开 <code>https://112.5.137.43:15027/</code>，再启动 VS Code / CodeBuddy。</li>
    </ol>

  <script>
    setTimeout(function () {
