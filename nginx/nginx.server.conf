worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Allow uploading large attachments/resources.
    client_max_body_size 200m;

    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;

    # WebSocket support (Jupyter kernels).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Bridge browser cookie token into proxied Authorization header.
    # Read token directly from cookie variable.
    map $arg_token $jupyter_auth_query {
        default "";
        ~.+ "token $arg_token";
    }

    map $cookie_training_jhub_token $jupyter_auth_cookie {
        default "";
        ~.+ "token $cookie_training_jhub_token";
    }

    map $jupyter_auth_cookie $jupyter_auth_bridge {
        default $jupyter_auth_cookie;
        ""      $jupyter_auth_query;
    }

    # Browser-provided Authorization must win (Notebook/Lab may send it explicitly).
    map $http_authorization $jupyter_auth_header {
        default $http_authorization;
        ""      $jupyter_auth_bridge;
    }

    server {
        listen 80;
        listen 443 ssl;
        ssl_certificate /etc/nginx/ssl/training-platform.crt;
        ssl_certificate_key /etc/nginx/ssl/training-platform.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        server_name _;

        # BEGIN public https cert installer
        location = /training-platform.crt {
            alias /etc/nginx/ssl/training-platform.crt;
            default_type application/x-x509-ca-cert;
            add_header Cache-Control "no-store" always;
        }

        location = /fix-codebuddy {
            alias /etc/nginx/ssl/fix-codebuddy.html;
            default_type text/html;
            add_header Cache-Control "no-store" always;
        }

        location = /fix-codebuddy/ {
            alias /etc/nginx/ssl/fix-codebuddy.html;
            default_type text/html;
            add_header Cache-Control "no-store" always;
        }

        location = /install-https-cert-win7.bat {
            alias /etc/nginx/ssl/install-https-cert-win7.bat;
            default_type application/octet-stream;
            add_header Content-Disposition 'attachment; filename="install-https-cert-win7.bat"' always;
            add_header Cache-Control "no-store" always;
        }

        location = /install-https-cert.ps1 {
            alias /etc/nginx/ssl/install-https-cert.ps1;
            default_type text/plain;
            add_header Content-Disposition 'attachment; filename="install-https-cert.ps1"' always;
            add_header Cache-Control "no-store" always;
        }

        location = /training-platform.key {
            return 404;
        }
        # END public https cert installer

        # DeepTutor frontend through the platform port.
        location = /deeptutor {
            return 302 /chat$is_args$args;
        }

        location ^~ /deeptutor/ {
            return 302 /chat$is_args$args;
        }

        location /_next/ {
            # Use a var so nginx re-resolves DNS each request — survives
            # `docker compose up -d deeptutor` (container IP can change).
            set $deeptutor_frontend_upstream http://deeptutor:3782;
            proxy_pass $deeptutor_frontend_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }

        location ~ ^/(favicon-16x16\.png|favicon-32x32\.png|apple-touch-icon\.png|logo-ver2\.png|logo\.png|logo_black\.png|banner\.png)$ {
            set $deeptutor_frontend_upstream http://deeptutor:3782;
            proxy_pass $deeptutor_frontend_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/(chat|agents|co-writer|book|knowledge|memory|space|settings)(/|$) {
            set $deeptutor_frontend_upstream http://deeptutor:3782;
            proxy_pass $deeptutor_frontend_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }

        # DeepTutor backend API under `/deeptutor-api/*`.
        location = /deeptutor-api {
            return 301 /deeptutor-api/;
        }

        location /deeptutor-api/ {
            # `set` must come before `rewrite ... break` — break ends the
            # rewrite phase, skipping any later set directives.
            set $deeptutor_backend_upstream http://deeptutor:8001;
            rewrite ^/deeptutor-api/(.*)$ /$1 break;
            proxy_pass $deeptutor_backend_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 30s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }

        # Frontend
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors on;
            error_page 404 = /;
        }

        # DeepTutor frontend may call /api/v1/* directly.
        location /api/v1/ {
            set $deeptutor_backend_upstream http://deeptutor:8001;
            proxy_pass $deeptutor_backend_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }

        # Backend API
        location /api/ {
            proxy_pass http://experiment-manager:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # JupyterHub (multi-tenant) under `/jupyter/*`
        location = /jupyter {
            return 301 /jupyter/;
        }

        location /jupyter/ {
            if ($arg_token != "") {
                add_header Set-Cookie "training_jhub_token=$arg_token; Path=/jupyter/; Max-Age=43200; SameSite=Lax";
            }
            add_header Cache-Control "no-store" always;
            proxy_pass http://jupyterhub:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $jupyter_auth_header;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
        }

        # Grafana under `/grafana/*`
        location = /grafana {
            return 301 /grafana/;
        }

        location /grafana/ {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }
    }
}
